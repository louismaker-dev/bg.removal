name: Build EG Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.*

      - name: Check onnxruntime
        run: python -c "import onnxruntime as o; print(o.__version__, o.get_available_providers())"

      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: ci-models
          key: lite-model-v1

      - name: Engine smoke test (lite model)
        run: python ci_test.py

      - name: Check app imports
        run: python -c "import webview; from bgremover.studio import Api, web_dir; assert (web_dir()/'index.html').exists(); print(Api().info())"

      - name: Stamp build number
        shell: pwsh
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          $v = python -c "from bgremover.version import VERSION; print(VERSION)"
          "v$v.${{ github.run_number }}" | Out-File -Encoding ascii -NoNewline bgremover/build.txt
          $notes = ("$env:MSG" -split "Co-Authored-By")[0].Trim()
          if (-not $notes) { $notes = "Maintenance build" }
          "## What's new`n`n$notes`n`n---`nDownload **EGStudio-win64.zip**, unzip it anywhere and run ``EGStudio.exe``. Already installed? The app offers this update by itself." | Out-File -Encoding utf8 release_notes.md

      - name: Build exe
        run: python build.py

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$PWD\selftest-data"
          $p = Start-Process -FilePath "dist\EGStudio\EGStudio.exe" -ArgumentList "--selftest" -Wait -PassThru
          $r = Get-Content "$PWD\selftest-data\BgRemover\selftest.txt" -Raw
          Write-Host $r
          $short = $r.Substring(0, [Math]::Min(900, $r.Length)) -replace "`r?`n", " | "
          if ($p.ExitCode -ne 0 -or -not $r.StartsWith("OK")) { Write-Host "::error::$short"; exit 1 }
          Write-Host "::notice::$short"

      - name: Mark files as downloaded from the internet (like a real user's zip)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist\EGStudio -File | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          $n = (Get-ChildItem -Recurse dist\EGStudio -File | Where-Object { Get-Item $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }).Count
          Write-Host "Marked $n files"

      - name: Repro check (fix switched off, expected to fail)
        shell: pwsh
        continue-on-error: true
        run: |
          Copy-Item -Recurse dist\EGStudio repro
          Remove-Item repro\EGStudio.exe.config
          $env:EGS_NO_UNBLOCK = "1"
          $env:LOCALAPPDATA = "$PWD\repro-data"
          $p = Start-Process -FilePath "repro\EGStudio.exe" -ArgumentList "--uitest" -PassThru
          $f = "$PWD\repro-data\BgRemover\uitest.txt"
          for ($i = 0; $i -lt 40 -and -not (Test-Path $f) -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 1 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          $log = if (Test-Path "$PWD\repro-data\BgRemover\log.txt") { (Get-Content "$PWD\repro-data\BgRemover\log.txt" -Raw) } else { "" }
          $res = if (Test-Path $f) { "window opened" } else { "no window" }
          $short = ("$res | " + $log.Substring([Math]::Max(0, $log.Length - 400))) -replace "`r?`n", " | "
          Write-Host "::notice title=Repro (fix off)::$short"

      - name: UI test the built exe (real window + WebView2)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$PWD\selftest-data"
          New-Item -ItemType Directory -Force -Path "$PWD\selftest-data\BgRemover\models" | Out-Null
          Copy-Item "ci-models\BgRemover\models\*.onnx" "$PWD\selftest-data\BgRemover\models\"
          $p = Start-Process -FilePath "dist\EGStudio\EGStudio.exe" -ArgumentList "--uitest" -PassThru
          $f = "$PWD\selftest-data\BgRemover\uitest.txt"
          for ($i = 0; $i -lt 240 -and -not (Test-Path $f); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path $f) { $r = Get-Content $f -Raw } else { $r = "NO RESULT FILE"; if (Test-Path "$PWD\selftest-data\BgRemover\log.txt") { $r += " LOG: " + (Get-Content "$PWD\selftest-data\BgRemover\log.txt" -Raw) } }
          Write-Host $r
          $short = $r.Substring(0, [Math]::Min(1500, $r.Length)) -replace "`r?`n", " | "
          Write-Host "::notice title=UI test::$short"
          if (-not $r.StartsWith("RESULT {")) { Write-Host "::error title=UI test::window did not open"; exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/EGStudio -DestinationPath EGStudio-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EGStudio-win64
          path: EGStudio-win64.zip

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from bgremover.version import VERSION; print(VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}.${{ github.run_number }}
          name: EG Studio ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body_path: release_notes.md
          files: EGStudio-win64.zip
          make_latest: true
