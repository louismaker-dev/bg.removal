name: Build EG Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.*

      - name: Check onnxruntime
        run: python -c "import onnxruntime as o; print(o.__version__, o.get_available_providers())"

      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: ci-models
          key: lite-model-v1

      - name: Engine smoke test (lite model)
        run: python ci_test.py

      - name: Check app imports
        run: python -c "import webview; from bgremover.studio import Api, web_dir; assert (web_dir()/'index.html').exists(); print(Api().info())"

      - name: Build exe
        run: python build.py

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$PWD\selftest-data"
          $p = Start-Process -FilePath "dist\EGStudio\EGStudio.exe" -ArgumentList "--selftest" -Wait -PassThru
          $r = Get-Content "$PWD\selftest-data\BgRemover\selftest.txt" -Raw
          Write-Host $r
          $short = $r.Substring(0, [Math]::Min(900, $r.Length)) -replace "`r?`n", " | "
          if ($p.ExitCode -ne 0 -or -not $r.StartsWith("OK")) { Write-Host "::error::$short"; exit 1 }
          Write-Host "::notice::$short"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/EGStudio -DestinationPath EGStudio-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EGStudio-win64
          path: EGStudio-win64.zip

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from bgremover.version import VERSION; print(VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}.${{ github.run_number }}
          name: EG Studio ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            Download **EGStudio-win64.zip**, unzip it anywhere, and run `EGStudio.exe`.
            Offline listing-image editor with AI background removal. The AI model downloads once on first use.
          files: EGStudio-win64.zip
          make_latest: true
