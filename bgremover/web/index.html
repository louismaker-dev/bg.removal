<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EG Studio</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- ============ TOP BAR ============ -->
  <header id="topbar">
    <div class="tb-left">
      <button class="brand" id="btnHome" title="Home">
        <span class="logo">EG</span><span class="brand-name">Studio</span>
      </button>
      <div class="menu-wrap">
        <button class="tb-btn" id="btnFile">File <i data-i="chevron-down"></i></button>
        <div class="menu" id="menuFile">
          <button data-act="new"><i data-i="file-plus"></i>New design…<kbd>Ctrl+N</kbd></button>
          <button data-act="open"><i data-i="folder-open"></i>Open project…<kbd>Ctrl+O</kbd></button>
          <button data-act="save"><i data-i="save"></i>Save project<kbd>Ctrl+S</kbd></button>
          <button data-act="saveas"><i data-i="save"></i>Save as…</button>
          <hr>
          <button data-act="resize"><i data-i="frame"></i>Resize design…</button>
          <button data-act="export"><i data-i="download"></i>Download image…<kbd>Ctrl+E</kbd></button>
          <hr>
          <button data-act="settings"><i data-i="settings"></i>Settings</button>
        </div>
      </div>
      <button class="tb-btn icon" id="btnUndo" title="Undo (Ctrl+Z)"><i data-i="undo-2"></i></button>
      <button class="tb-btn icon" id="btnRedo" title="Redo (Ctrl+Y)"><i data-i="redo-2"></i></button>
      <span class="tb-sep"></span>
      <span id="saveState" class="muted small"></span>
    </div>
    <div class="tb-center">
      <input id="docName" value="Untitled design" spellcheck="false">
      <span id="docSize" class="muted small"></span>
    </div>
    <div class="tb-right">
      <span id="deviceBadge" class="chip" title="Where the AI runs"><i data-i="cpu"></i><span>AI: ready</span></span>
      <button class="tb-btn" id="btnBulk"><i data-i="files"></i>Bulk create</button>
      <button class="btn-accent" id="btnExport"><i data-i="download"></i>Download</button>
    </div>
  </header>

  <div id="main">
    <!-- ============ LEFT RAIL ============ -->
    <nav id="rail">
      <button data-panel="templates" class="active"><i data-i="layout-template"></i><span>Templates</span></button>
      <button data-panel="elements"><i data-i="shapes"></i><span>Elements</span></button>
      <button data-panel="text"><i data-i="type"></i><span>Text</span></button>
      <button data-panel="uploads"><i data-i="upload"></i><span>Uploads</span></button>
      <button data-panel="background"><i data-i="paint-bucket"></i><span>Background</span></button>
      <button data-panel="tools"><i data-i="wand-sparkles"></i><span>AI Tools</span></button>
      <button data-panel="layers"><i data-i="layers"></i><span>Layers</span></button>
    </nav>

    <!-- ============ SIDE PANEL ============ -->
    <aside id="panel">
      <div class="panel-head">
        <h3 id="panelTitle">Templates</h3>
        <button class="icon-btn" id="btnPanelClose" title="Hide panel"><i data-i="x"></i></button>
      </div>
      <div id="panelBody"></div>
    </aside>

    <!-- ============ WORKSPACE ============ -->
    <section id="workspace">
      <div id="ctxbar"></div>
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="dropHint"><i data-i="image"></i><span>Drop images to add them</span></div>
      </div>
      <div id="pagesBar"><div id="pagesStrip"></div></div>
      <footer id="statusbar">
        <span id="pageLabel" class="muted small"></span>
        <div class="zoom">
          <button class="icon-btn" id="zoomOut" title="Zoom out (Ctrl -)"><i data-i="zoom-out"></i></button>
          <input type="range" id="zoomRange" min="5" max="400" value="100">
          <button class="icon-btn" id="zoomIn" title="Zoom in (Ctrl +)"><i data-i="zoom-in"></i></button>
          <button class="chip-btn" id="zoomFit" title="Fit (Ctrl 0)">Fit</button>
          <span id="zoomLabel" class="small">100%</span>
        </div>
      </footer>
    </section>
  </div>
</div>

<!-- ============ HOME SCREEN ============ -->
<div id="home" class="overlay">
  <div class="home-inner">
    <div class="home-hero">
      <div>
        <h1>What will you design today?</h1>
        <p class="muted">Listing images, banners and promos, fully offline. AI background removal built in.</p>
      </div>
      <div class="home-actions">
        <button class="tb-btn" data-home="open"><i data-i="folder-open"></i>Open project</button>
        <button class="tb-btn" data-home="bgtool"><i data-i="scissors"></i>Remove backgrounds (batch)</button>
        <button class="tb-btn" data-home="bulk"><i data-i="files"></i>Bulk listing generator</button>
      </div>
    </div>
    <h2>Start a new design</h2>
    <div id="sizeCards" class="size-cards"></div>
    <div id="homeContinue"></div>
    <h2>Recent projects</h2>
    <div id="recentGrid" class="recent-grid"></div>
  </div>
</div>

<!-- ============ MODALS ============ -->
<div id="modal" class="overlay hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" id="modalClose"><i data-i="x"></i></button></div>
    <div id="modalBody"></div>
    <div id="modalFoot"></div>
  </div>
</div>

<div id="busy" class="overlay hidden">
  <div class="busy-box">
    <div class="spinner"></div>
    <div id="busyMsg">Working…</div>
    <div class="bar"><div id="busyBar"></div></div>
    <button class="tb-btn" id="busyCancel" hidden>Cancel</button>
  </div>
</div>

<div id="toasts"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="projInput" accept=".egs,.json" hidden>

<script>window.__errs=[];window.addEventListener("error",e=>window.__errs.push(String(e.message)+" @"+(e.filename||"").split("/").pop()+":"+e.lineno));window.addEventListener("unhandledrejection",e=>window.__errs.push("promise: "+String(e.reason&&e.reason.message||e.reason)));</script>
<script src="vendor/fabric.min.js"></script>
<script src="js/ui-icons.js"></script>
<script src="js/icons-data.js"></script>
<script src="js/util.js"></script>
<script src="js/bridge.js"></script>
<script src="js/fonts.js"></script>
<script src="js/editor.js"></script>
<script src="js/pages.js"></script>
<script src="js/effects.js"></script>
<script src="js/elements.js"></script>
<script src="js/templates.js"></script>
<script src="js/panels.js"></script>
<script src="js/ctxbar.js"></script>
<script src="js/generator.js"></script>
<script src="js/main.js"></script>
</body>
</html>
